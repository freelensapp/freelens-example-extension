name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  kind_version: 0.33.0 # datasource=github-releases depName=kubernetes-sigs/kind
  kubernetes_version: 1.37.0 # datasource=docker depName=kindest/node

jobs:
  test-integration:
    name: "integration tests with Freelens ${{ matrix.freelens_version }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          # No Freelens release has the v2 extension API yet; `main` is the
          # only ref that does.
          - freelens_version: main

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      DO_NOT_TRACK: "1"
      TURBOREPO_CACHE: ${{ github.workspace }}/freelens/.turbo

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.11 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: node-freelens-${{ matrix.freelens_version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-freelens-${{ matrix.freelens_version }}-

      - name: Install pnpm dependencies for extension
        id: install-pnpm-extension
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for extension (retry)
        if: steps.install-pnpm-extension.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The tests install this checkout in place, so Freelens loads the
      # extension from dist/.
      - name: Build plugin
        id: build-plugin
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry)
        id: build-plugin-2
        if: steps.build-plugin.outcome == 'failure'
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry 2)
        if: steps.build-plugin-2.outcome == 'failure'
        run: pnpm build

      # The tests attach to Electron's own Chromium over CDP, so Playwright's
      # browsers are never downloaded. `install-deps` still apt-installs the
      # shared libraries that Chromium (and thus Electron) needs to launch
      # under xvfb.
      - name: Install Playwright's OS dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Checkout app
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: ${{ matrix.freelens_version }}
          path: freelens

      - name: Setup node for app
        uses: actions/setup-node@v7
        with:
          node-version-file: freelens/.nvmrc
          package-manager-cache: false

      # pnpm-lock.yaml holds several YAML documents (pnpm 12 puts
      # packageManagerDependencies in a document of its own), so evaluate them
      # all and take the one that has the importer. The version carries a peer
      # suffix, e.g. 1.2.3(supports-color@8.1.1), which split drops.
      - name: Get Electron version
        run: |
          electron_version=$(yq ea -r '[.importers.freelens.devDependencies.electron.version | select(. != null)] | .[0] // error("electron not found in pnpm-lock.yaml") | split("(") | .[0]' freelens/pnpm-lock.yaml)
          echo "electron_version=${electron_version}" >> ${GITHUB_ENV}

      # The electron package downloads the Electron zip into the OS-default
      # Electron cache dir on install.
      - name: Use Electron cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: ubuntu-24.04-arm-electron-${{ env.electron_version }}
          restore-keys: |
            ubuntu-24.04-arm-electron-

      - name: Use Turborepo cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: ubuntu-24.04-arm-turborepo-${{ hashFiles('freelens/**/package.json', 'freelens/**/pnpm-lock.yaml', 'freelens/turbo.json') }}
          restore-keys: |
            ubuntu-24.04-arm-turborepo-

      - name: Install pnpm dependencies for app
        id: install-pnpm-app
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for app (retry)
        if: steps.install-pnpm-app.outcome == 'failure'
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # kubectl and freelens-k8s-proxy, which the app needs to connect to a
      # cluster. `pnpm dev` does not download them.
      - name: Build extra resources
        id: build-resources
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.build-resources.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.build-resources-2.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources

      - name: Start KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: freelens
          version: v${{ env.kind_version }}
          node_image: kindest/node:v${{ env.kubernetes_version }}
          wait: 5m

      # Freelens dev, as a developer runs it, with its CDP endpoint on port
      # 9223. It keeps running in the background for the next steps; its output
      # is the main log the tests read. FREELENS_INTEGRATION_TESTING_DIR gives
      # it a fresh profile; the app accepts it only under the system's temporary
      # directory. Electron's sandbox helper needs to be setuid root.
      - name: Start Freelens dev
        working-directory: freelens
        run: |
          chrome_sandbox="$(dirname "$(cd freelens && node -p 'require("electron")')")/chrome-sandbox"
          sudo chown root:root "$chrome_sandbox"
          sudo chmod 4755 "$chrome_sandbox"
          nohup xvfb-run -a pnpm dev > "$FREELENS_MAIN_LOG" 2>&1 &
          if ! timeout 900 bash -c 'until curl -sf http://127.0.0.1:9223/json/version; do sleep 5; done'; then
            cat "$FREELENS_MAIN_LOG"
            exit 1
          fi
        env:
          FREELENS_INTEGRATION_TESTING_DIR: /tmp/freelens-integration-testing
          FREELENS_MAIN_LOG: ${{ runner.temp }}/freelens-dev.log

      - name: Setup node for plugin
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The tests run three sessions against the one app: the install test and
      # one session per API version of the Example CRD, each of which applies
      # the manifests of its version to the kind cluster named by
      # TEST_KIND_CLUSTER_NAME, and removes them again.
      #
      # The tests are deterministic, so a failure is not retried. A failing view
      # costs one view timeout.
      - name: Run integration tests
        run: timeout 600 pnpm --color=always test:integration --reporter=verbose --reporter=github-actions --includeTaskLocation
        env:
          FREELENS_MAIN_LOG: ${{ runner.temp }}/freelens-dev.log
          TEST_KIND_CLUSTER_NAME: freelens

      - name: Show Freelens dev output
        if: always()
        run: cat "${{ runner.temp }}/freelens-dev.log" || true
